name: Cross-encoder baseline

# On demand. Downloads the cross-encoder from the Hugging Face Hub and the MQP dataset,
# scores both datasets on CPU and commits results/rerank/.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id of the cross-encoder
        default: cross-encoder/quora-distilroberta-base
      revision:
        description: Model revision (branch, tag or commit) to pin
        default: main

permissions:
  contents: write

concurrency:
  group: rerank
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inputs reach shell steps through env vars, never by direct interpolation into scripts.
    env:
      MODEL: ${{ inputs.model }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run rerank -- --model "$MODEL" --revision "$REVISION"

      - uses: actions/upload-artifact@v4
        with:
          name: rerank-results
          path: results/rerank/
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/rerank/
          git diff --cached --quiet && exit 0
          git commit -m "Update cross-encoder results [skip ci]"
          git pull --rebase --autostash
          git push
