name: Track A (MQP, whole cache)

# On demand only: each run can take up to ~50 minutes of the Actions quota.
on:
  workflow_dispatch:
    inputs:
      judge:
        description: Ollama model used as the judge
        default: qwen2.5:3b
      k:
        description: Neighbors passed to the judge (top-k)
        default: '3'
      report_dir:
        description: Folder under results/ for the report
        default: mqp

# Read-only by default. Only the `commit` job, which runs no downloaded code,
# gets a token that can push.
permissions:
  contents: read

concurrency:
  group: track-a
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # Inputs reach shell steps through env vars, never by direct interpolation into scripts.
    env:
      JUDGE: ${{ inputs.judge }}
      TOP_K: ${{ inputs.k }}
      REPORT_DIR: ${{ inputs.report_dir }}
    timeout-minutes: 58
    steps:
      # report_dir becomes a path (results/<report_dir>/) for the report writer and
      # for `git add`; it must be a single folder name. The others reach commands as
      # arguments and must not look like options.
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$REPORT_DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail "report_dir must be a single folder name (letters, digits, . _ -)"
          [[ "$JUDGE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]] || fail "judge is not a valid Ollama model name"
          [[ "$TOP_K" =~ ^[1-9][0-9]*$ ]] || fail "k must be a positive integer"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Embeddings and judge verdicts carry over between runs, so an interrupted run resumes.
      - name: Restore embedding and judge caches
        uses: actions/cache/restore@v4
        with:
          path: |
            results/.embeddings-cache.json
            results/.judge-cache.json
          key: track-a-caches-${{ github.run_id }}
          restore-keys: track-a-caches-

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull models
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull nomic-embed-text
          ollama pull "$JUDGE"

      - run: npm ci
      - run: npm test
      - run: npm run track-a -- --time-budget 32 --judge "$JUDGE" --k "$TOP_K" --report-dir "$REPORT_DIR"
        timeout-minutes: 45

      - name: Save embedding and judge caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            results/.embeddings-cache.json
            results/.judge-cache.json
          key: track-a-caches-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: track-a-results
          path: results/${{ inputs.report_dir }}/
          retention-days: 7

  # Separate job: the Ollama installer and the models above run with a read-only
  # token; this one has the write token and executes nothing but git.
  commit:
    name: Commit results
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      JUDGE: ${{ inputs.judge }}
      REPORT_DIR: ${{ inputs.report_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: track-a-results
          path: results/${{ inputs.report_dir }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$REPORT_DIR/"
          git diff --cached --quiet && exit 0
          git commit -m "Update Track A results ($JUDGE) [skip ci]"
          git pull --rebase --autostash
          git push
