name: Run experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/pairs.jsonl'

# Read-only by default. Only the `commit` job, which runs no downloaded code,
# gets a token that can push.
permissions:
  contents: read

concurrency:
  group: run-experiment
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the embedding model
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull nomic-embed-text
          ollama pull qwen2.5:3b
          ollama pull llama3.2:3b
          ollama pull qwen2.5:7b
          ollama pull mxbai-embed-large
          ollama pull bge-m3

      - run: npm ci
      - run: npm test
      - run: npm run all
      - run: npm run models
      - run: npm run verify
      - run: npm run chart

      # Hidden files included: results/.judge-cache.json is tracked and reused by later runs.
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          include-hidden-files: true
          retention-days: 7

  # Separate job: the Ollama installer and the models above run with a read-only
  # token; this one has the write token and executes nothing but git.
  commit:
    name: Commit results
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: results
          path: results

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet && exit 0
          git commit -m "Update experiment results [skip ci]"
          git push
